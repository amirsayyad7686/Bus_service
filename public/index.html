<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MC60 Live Tracker</title>
<link rel="stylesheet" href="/style.css">
<script src="/socket.io/socket.io.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<header>
  <h1>MC60 Live Tracker</h1>
  <div id="conn" class="badge bad">offline</div>
</header>

<main>
  <section id="viewer">
    <canvas id="carCanvas"></canvas>
    <div id="viewerHint">drag to orbit · scroll to zoom</div>
  </section>

  <aside id="panel">
    <div class="card">
      <h2>Speed</h2>
      <canvas id="speedGauge"></canvas>
    </div>

    <div class="card map-card">
      <h2>Route
        <button id="clearMap" class="mini">clear</button>
      </h2>
      <canvas id="trackMap"></canvas>
    </div>

    <div class="card">
      <h2>Position</h2>
      <div class="row"><span>Latitude</span><span id="lat">—</span></div>
      <div class="row"><span>Longitude</span><span id="lon">—</span></div>
      <div class="row"><span>GPS fix</span><span id="fix" class="val bad">NO</span></div>
      <div class="row"><span>Distance</span><span id="dist">—</span></div>
    </div>

    <div class="card">
      <h2>Orientation</h2>
      <div class="row"><span>Pitch</span><span id="pitch">—</span></div>
      <div class="row"><span>Roll</span><span id="roll">—</span></div>
      <div class="row"><span>Yaw</span><span id="yaw">—</span></div>
    </div>

    <div class="card">
      <h2>Gyroscope (°/s)</h2>
      <div class="row"><span>gx</span><span id="gx">—</span></div>
      <div class="row"><span>gy</span><span id="gy">—</span></div>
      <div class="row"><span>gz</span><span id="gz">—</span></div>
    </div>

    <div class="card">
      <h2>Accelerometer (g)</h2>
      <div class="row"><span>ax</span><span id="ax">—</span></div>
      <div class="row"><span>ay</span><span id="ay">—</span></div>
      <div class="row"><span>az</span><span id="az">—</span></div>
    </div>

    <div class="card small">
      <div class="row"><span>Last update</span><span id="last">—</span></div>
      <div class="row"><span>Packets</span><span id="count">0</span></div>
    </div>
  </aside>
</main>

<script type="module" src="/app.js"></script>
</body>
</html>
